events { worker_connections 64; }
http {
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/html text/css application/javascript;

  upstream tts_api {
    server 127.0.0.1:{{ .Values.apiPort }};
  }

  upstream tts_transcode {
    server 127.0.0.1:{{ .Values.transcodePort }};
  }

  server {
    listen {{ .Values.dashboardPort }};
    server_name _;

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # MP3 transcode for LiteLLM/Open WebUI (they expect audio/mpeg)
    location = /v1/audio/speech {
      proxy_pass http://tts_transcode;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_connect_timeout 30s;
    }

    # Everything else under /v1 (clone, design, models, voices) direct to API
    location /v1/ {
      proxy_pass http://tts_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_connect_timeout 30s;
    }

    location = /health {
      proxy_pass http://tts_api;
      proxy_set_header Host $host;
    }
  }
}