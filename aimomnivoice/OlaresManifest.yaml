---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimomnivoice: 1

metadata:
  name: aimomnivoice
  appid: aimomnivoice
  icon: https://raw.githubusercontent.com/bayerhazard/aimomnivoice/main/icon.png
  description: OmniVoice 0.6B TTS — zero-shot voice cloning, voice design, 600+ languages, OpenAI-compatible API
  title: AIM OmniVoice 0.6B TTS
  version: '26.10.2'
  categories:
    - Audio

# Internal shared API for Router / in-cluster callers (Model Console data plane).
sharedEntrances:
  - name: aimomnivoice
    host: sharedentrances-api
    port: 0
    title: AIM OmniVoice 0.6B TTS
    invisible: true
    authLevel: internal
    icon: https://raw.githubusercontent.com/bayerhazard/aimomnivoice/main/icon.png

entrances:
  - name: aimomnivoice
    port: 8090
    host: download-svc
    title: AIM OmniVoice 0.6B TTS
    icon: https://raw.githubusercontent.com/bayerhazard/aimomnivoice/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.10.2'
  onlyAdmin: true
  upgradeDescription: |
    v26.10.2: CPU request right-sized (requiredCpu 2 -> 1500m; measured peak 1.14 cores) so the app fits the worker node CPU-request budget. No behavior change. Built for Olares 1.12.7.
    v26.10.1: Formatbewusster TTS-Proxy. mp3 und opus kann die Engine nicht selbst und antwortete bisher mit WAV-Bytes unter Content-Type audio/mpeg; der Proxy re-encodiert diese per ffmpeg, wav/flac/ogg gehen unveraendert durch. Der Model-Console-Proxy zeigt jetzt auf nginx statt direkt auf die API, damit Format und Content-Type fuer alle Aufrufer (Router, Rocket, Open WebUI, Wings) stimmen; /openapi.json und /docs bleiben ueber nginx als JSON erreichbar. Built for Olares 1.12.7.
    v26.9.5: mp3/opus kamen bisher als WAV mit falschem Content-Type aus der Engine. Der Model-Console-Proxy zeigte direkt auf die API (apiPort 8880) und umging damit den Format-Proxy; er zeigt jetzt auf nginx (dashboardPort 8080), der /v1/audio/speech an den Format-Proxy und alles andere an die API leitet. Der Format-Proxy ist formatbewusst: mp3/opus werden per ffmpeg encodiert, wav/flac/ogg gehen unveraendert durch. Damit stimmen Format und Content-Type fuer alle Aufrufer (Router, Rocket, Open WebUI, Wings).
    v26.9.4: Olares Router integration. A beclab/llm-init sidecar now fronts the app (ENGINE_KIND=audio, MODEL_MODE=tts, MODEL_SUPPORTS=supports_tts,supports_tts_clone,supports_tts_design,supports_tts_custom) and serves the Model Console contract (/api/model-spec) on the shared entrance, so Router auto-discovers the model and fills the default-tts categories. Inference path and voice quality are unchanged. Built for Olares 1.12.7.
    v26.9.3: GPU resources + CUDA cap hardcoded in the template (dodges the Olares values-freeze on upgrade) - HAMi memory slice 5 GiB.
    v26.9.2: HAMi memory-slice pinned to 5 GiB (nvidia.com/gpumem) and the CUDA soft cap aligned to 5120m so the RTX 5090 on olares-worker can host OmniVoice TTS, Qwen3-ASR, PaddleOCR and the Qwen3 Reranker co-resident. Built for Olares 1.12.6.
  fullDescription: |
    **OmniVoice-0.6B** — k2-fsa's massively multilingual zero-shot TTS (600+ languages) based on a Qwen3-0.6B diffusion language model.

    **Model**
    k2-fsa/OmniVoice (~2.5 GB fp16), trained on 581k hours of open-source speech data. Apache-2.0 licensed.

    **Inference Engine**
    Native omnivoice runtime (PyTorch 2.8 cu128) behind an OpenAI-compatible FastAPI wrapper. Single process, requests queued per device.

    **Key Features**
    - OpenAI-compatible API: /v1/audio/speech, /v1/models, /v1/voices
    - Zero-shot voice cloning from 3-10 s reference audio: POST /v1/audio/clone
    - Voice design via attributes: "female, low pitch, british accent"
    - Preset voices (auto, female, male, child, whisper, ...) mapped to design instructs
    - Non-verbal tags like [laughter], pronunciation control via phonemes/pinyin
    - 24 kHz output; WAV->MP3 transcode sidecar for LiteLLM/Open WebUI compatibility
    - Web dashboard for quick testing (synthesis + health)

    **API Example**
    ```bash
    curl -X POST http://localhost:8880/v1/audio/speech \
      -H "Content-Type: application/json" \
      -d '{"model": "omnivoice", "input": "Hallo Welt!", "voice": "female"}' \
      -o output.wav
    ```

    **Resource Usage**
    GPU: 1× NVIDIA (5 GiB HAMi memory slice, co-resident with Qwen3-ASR, PaddleOCR and the Qwen3 Reranker)
    RAM: 6-16 GB, CPU: 2-8 cores
    Disk: 20 GB (model cache)

    **Note:** Apache-2.0 — free for personal and commercial use. Only clone voices you have the rights and consent to clone.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimomnivoice
  sourceCode: https://github.com/bayerhazard/aimomnivoice
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: "1500m"
  limitedCpu: "8"
  requiredMemory: 6Gi
  limitedMemory: 16Gi
  requiredDisk: 20Gi
  limitedDisk: 50Gi
  requiredGpu: 1

permission:
  appData: true
  appCache: true
  appCommon: true

envs:
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: false
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_ENDPOINT
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 0
  allowMultipleInstall: false
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
