---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimomnivoice-dashboard
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    events { worker_connections 64; }
    http {
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
      access_log /dev/stdout main;
      error_log /dev/stderr warn;
      sendfile on;
      tcp_nopush on;
      keepalive_timeout 65;
      gzip on;
      gzip_types text/html text/css application/javascript;

      upstream tts_api {
        server 127.0.0.1:{{ .Values.apiPort }};
      }

      upstream tts_transcode {
        server 127.0.0.1:{{ .Values.transcodePort }};
      }

      server {
        listen {{ .Values.dashboardPort }};
        server_name _;

        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ /index.html;
        }

        # MP3 transcode for LiteLLM/Open WebUI (they expect audio/mpeg)
        location = /v1/audio/speech {
          proxy_pass http://tts_transcode;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_connect_timeout 30s;
        }

        # Everything else under /v1 (clone, design, models, voices) direct to API
        location /v1/ {
          proxy_pass http://tts_api;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_connect_timeout 30s;
        }

        location = /health {
          proxy_pass http://tts_api;
          proxy_set_header Host $host;
        }
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIM OmniVoice TTS — Dashboard</title>
    <style>
    :root{
      --b-25:#000714; --b-50:#010e1d; --b-100:#041120; --b-150:#081a2e;
      --b-200:#10243c; --b-300:#1d3a5c; --b-400:#2f5178;
      --b-500:#4a6c95; --b-600:#708bab; --b-700:#9bafc6;
      --b-800:#c6d2e0; --b-900:#e6ebf1;
      --gold:#c9a45c; --gold-hell:#d5b371; --gold-tief:#b28b42;
      --marke:var(--gold); --marke-hell:var(--gold-hell); --marke-tief:var(--gold-tief);
      --auf-marke:var(--b-25);
      --bg:var(--b-50); --surface:var(--b-100); --surface2:var(--b-150);
      --border:var(--b-300); --border-soft:var(--b-200);
      --text:var(--b-800); --text-stark:#fff; --text-dim:var(--b-500);
      --marke-flaeche:color-mix(in oklab, var(--marke) 12%, transparent);
      --marke-rand:color-mix(in oklab, var(--marke) 44%, transparent);
      --fokus:var(--marke-hell);
      --success:#4ade80; --error:#f87171;
      --schrift:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
      --mono:ui-monospace,'SF Mono','Fira Code',Menlo,Consolas,monospace;
      --radius:8px;
      --seite:clamp(1rem, 3.5vw, 2.5rem);
      --inhalt:60rem;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    body{
      font-family:var(--schrift);
      background:
        radial-gradient(1200px 600px at 80% -10%, color-mix(in oklab, var(--marke) 9%, transparent), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, color-mix(in oklab, var(--marke) 5%, transparent), transparent 55%),
        var(--bg);
      color:var(--text); line-height:1.6; min-height:100vh;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    :focus-visible{outline:2px solid var(--fokus);outline-offset:2px;border-radius:4px}
    .container{width:min(100% - var(--seite)*2, var(--inhalt));margin-inline:auto;padding-block:24px}
    .kicker{
      display:inline-flex;align-items:center;gap:.55rem;
      font-family:var(--mono);font-size:.68rem;font-weight:600;
      letter-spacing:.18em;text-transform:uppercase;
      color:var(--marke);margin-bottom:1.1rem;
    }
    .kicker::before{content:"";inline-size:1.4rem;block-size:1px;background:var(--marke-rand);display:block}
    .header{
      display:flex;align-items:center;justify-content:space-between;gap:1rem;
      margin-bottom:1.75rem;padding-block:.25rem 1rem;
      border-bottom:1px solid var(--border-soft);
    }
    .header h1{font-size:clamp(1.4rem,1.1rem + 1vw,1.7rem);font-weight:700;letter-spacing:-.02em;color:var(--text-stark);line-height:1.1}
    .header h1::first-letter{color:var(--marke)}
    .header .subtitle{font-size:.82rem;color:var(--text-dim);margin-top:.15rem}
    .lang-toggle{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--border-soft);border-radius:6px;padding:2px;flex-shrink:0}
    .lang-toggle button{border:none;background:transparent;color:var(--text-dim);font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.1em;padding:.3rem .6rem;border-radius:4px;cursor:pointer;transition:all .16s ease}
    .lang-toggle button:hover{color:var(--text-stark)}
    .lang-toggle button.active{background:var(--marke);color:var(--auf-marke)}
    .card{background:linear-gradient(180deg,var(--surface),var(--b-100));border:1px solid var(--border-soft);border-radius:var(--radius);padding:1.1rem 1.2rem;margin-bottom:16px}
    .card-title{font-size:.95rem;font-weight:600;color:var(--text-stark);margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .card-title .icon{font-size:1.05rem;color:var(--marke)}
    textarea,input[type=text]{
      width:100%;min-height:110px;padding:.75rem .85rem;border-radius:6px;
      border:1px solid var(--border);background:var(--surface2);color:var(--text);
      font-family:var(--schrift);font-size:.95rem;line-height:1.6;resize:vertical;outline:none;
    }
    input[type=text]{min-height:2.4rem;resize:none}
    textarea:focus,input[type=text]:focus{border-color:var(--marke)}
    textarea::placeholder,input::placeholder{color:var(--text-dim)}
    .controls{display:flex;gap:.75rem;margin-top:1rem;align-items:center;flex-wrap:wrap}
    select{flex:1;min-width:12rem;padding:.55rem .7rem;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.9rem;outline:none;cursor:pointer;font-family:var(--schrift)}
    select:focus{border-color:var(--marke)}
    select option{background:var(--surface)}
    label.fld{display:block;font-size:.72rem;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin:.75rem 0 .3rem}
    input[type=file]{font-family:var(--mono);font-size:.78rem;color:var(--text-dim)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
      block-size:2.5rem;padding-inline:1.1rem;
      border:1px solid var(--border);border-radius:6px;
      background:var(--surface2);color:var(--text);
      font-family:var(--schrift);font-size:.85rem;font-weight:600;line-height:1;
      white-space:nowrap;cursor:pointer;user-select:none;
      transition:background-color .16s ease,border-color .16s ease,color .16s ease;
    }
    .btn:hover{border-color:var(--marke-rand);background:var(--marke-flaeche);color:var(--text-stark)}
    .btn.primary{background:var(--marke);border-color:var(--marke);color:var(--auf-marke)}
    .btn.primary:hover{background:var(--marke-hell);border-color:var(--marke-hell)}
    .btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
    .audio-wrap{margin-top:1rem;padding:.9rem 1rem;border-radius:var(--radius);background:var(--b-25);border:1px solid var(--border-soft);display:none}
    .audio-wrap.show{display:block}
    .audio-wrap audio{width:100%;height:42px;border-radius:6px}
    .audio-wrap .size{margin-top:.4rem;font-size:.72rem;color:var(--text-dim);font-family:var(--mono)}
    .status{margin-top:1rem;font-size:.85rem;color:var(--text-dim);min-height:1.5rem;display:flex;align-items:center;gap:8px}
    .status.error{color:var(--error)}
    .status.success{color:var(--success)}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--marke);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
    .info-item{background:var(--b-25);border:1px solid var(--border-soft);border-radius:6px;padding:.7rem .8rem}
    .info-item .k{font-size:.64rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.14em;font-family:var(--mono);font-weight:600;margin-bottom:.25rem}
    .info-item .v{font-size:.85rem;color:var(--text-stark);font-weight:500}
    .foot{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border-soft);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.74rem;color:var(--text-dim);font-family:var(--mono)}
    .foot .health{display:inline-flex;align-items:center;gap:6px}
    .foot .health .ok{color:var(--success)}
    .foot .health .bad{color:var(--error)}
    @media (max-width:600px){
      .header{flex-direction:column;gap:12px;align-items:flex-start}
      .controls select{flex:none;width:100%}
      .btn{flex:1}
    }
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}
    @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
    </style>
    </head>
    <body>
    <div class="container">

      <div class="header">
        <div>
          <h1>AIM OmniVoice TTS</h1>
          <div class="subtitle" data-i18n="subtitle">OmniVoice 0.6B — 600+ Sprachen, Voice Design &amp; Cloning, 24 kHz</div>
        </div>
        <div class="lang-toggle" role="group" aria-label="Sprache">
          <button type="button" id="langDE" class="active">DE</button>
          <button type="button" id="langEN">EN</button>
        </div>
      </div>

      <span class="kicker" data-i18n="kicker">Sprachsynthese</span>

      <!-- Karte 1: Synthese -->
      <div class="card">
        <div class="card-title"><span class="icon">●</span><span data-i18n="ttsTitle">Synthese</span></div>
        <textarea id="textInput" data-i18n-ph="ttsPlaceholder">Hallo, das ist ein Test der OmniVoice-Sprachsynthese.</textarea>
        <div class="controls">
          <select id="voiceSelect" aria-label="Stimme">
            <option value="auto">Auto</option>
            <option value="female" selected>Weiblich</option>
            <option value="male">Männlich</option>
            <option value="child">Kind</option>
            <option value="elderly">Ältere Stimme</option>
            <option value="whisper">Flüstern</option>
            <option value="female_en">Weiblich (US)</option>
            <option value="male_en">Männlich (US)</option>
            <option value="female_br">Weiblich (UK)</option>
            <option value="male_br">Männlich (UK)</option>
          </select>
          <input type="text" id="instructInput" data-i18n-ph="instructPh" style="flex:2" placeholder="">
          <button class="btn primary" id="generateBtn" data-i18n="genBtn">Synthese starten</button>
        </div>
        <div class="hint" style="color:var(--text-dim);font-size:.78rem;margin-top:.5rem" data-i18n="ttsHint">Freie Attribut-Beschreibung überschreibt die Preset-Auswahl.</div>
      </div>

      <!-- Karte 2: Voice Cloning -->
      <div class="card">
        <div class="card-title"><span class="icon">◈</span><span data-i18n="cloneTitle">Voice Cloning</span></div>
        <label class="fld" for="refAudio" data-i18n="refAudioLbl">Referenz-Audio (3–10 s, WAV/MP3)</label>
        <input type="file" id="refAudio" accept="audio/*">
        <label class="fld" for="refText" data-i18n="refTextLbl">Referenz-Transkript (exakter Text)</label>
        <input type="text" id="refText" data-i18n-ph="refTextPh" placeholder="">
        <div class="controls">
          <button class="btn primary" id="cloneBtn" data-i18n="cloneBtn">Klonen &amp; sprechen</button>
        </div>
        <div class="hint" style="color:var(--text-dim);font-size:.78rem;margin-top:.5rem" data-i18n="cloneHint">POST /v1/audio/clone — nur Stimmen klonen, für die du Rechte und Einverständnis hast.</div>
      </div>

      <!-- Karte 3: Service -->
      <div class="card">
        <div class="card-title"><span class="icon">▤</span><span data-i18n="svcTitle">Service</span></div>
        <div class="info-grid">
          <div class="info-item"><div class="k" data-i18n="svcEngine">Engine</div><div class="v">omnivoice (native)</div></div>
          <div class="info-item"><div class="k" data-i18n="svcApi">API</div><div class="v">/v1/audio/speech · /clone · /design</div></div>
          <div class="info-item"><div class="k" data-i18n="svcLang">Sprachen</div><div class="v">600+</div></div>
          <div class="info-item"><div class="k" data-i18n="svcFmt">Format</div><div class="v">24 kHz</div></div>
        </div>
      </div>

      <div class="status" id="status"></div>
      <div class="audio-wrap" id="audioWrap">
        <audio id="player" controls></audio>
        <div class="size" id="audioSize"></div>
      </div>

      <div class="foot">
        <div class="health" id="healthInfo"><span data-i18n="healthChecking">Status wird geprüft…</span></div>
        <div class="cfg">
          <span><b data-i18n="cfgModel">Modell</b>: k2-fsa/OmniVoice</span>
        </div>
      </div>
    </div>
    <script>
    const I18N = {
      de: {
        subtitle: 'OmniVoice 0.6B — 600+ Sprachen, Voice Design & Cloning, 24 kHz',
        kicker: 'Sprachsynthese',
        ttsTitle: 'Synthese', ttsPlaceholder: 'Text zum Sprechen eingeben…',
        instructPh: 'Freie Beschreibung, z. B. "weiblich, ruhig"',
        ttsHint: 'Freie Attribut-Beschreibung überschreibt die Preset-Auswahl.',
        cloneTitle: 'Voice Cloning',
        refAudioLbl: 'Referenz-Audio (3–10 s, WAV/MP3)',
        refTextLbl: 'Referenz-Transkript (exakter Text)',
        refTextPh: 'Was im Referenz-Audio gesagt wird …',
        cloneBtn: 'Klonen & sprechen',
        cloneHint: 'POST /v1/audio/clone — nur Stimmen klonen, für die du Rechte und Einverständnis hast.',
        svcTitle: 'Service', svcEngine: 'Engine', svcApi: 'API', svcLang: 'Sprachen', svcFmt: 'Format',
        genBtn: 'Synthese starten', genBtnBusy: 'Synthese läuft…', cloneBtnBusy: 'Cloning läuft…',
        healthChecking: 'Status wird geprüft…', healthOk: 'Bereit', healthBad: 'Nicht erreichbar',
        cfgModel: 'Modell', errNoText: 'Bitte zuerst Text eingeben.',
        errNoRef: 'Bitte Referenz-Audio auswählen.', generating: 'Audio wird erzeugt…',
        done: 'Fertig', size: 'Größe', emptyAudio: '(leeres Audio)', errFileRead: 'Datei konnte nicht gelesen werden.',
      },
      en: {
        subtitle: 'OmniVoice 0.6B — 600+ languages, voice design & cloning, 24 kHz',
        kicker: 'Speech Synthesis',
        ttsTitle: 'Synthesis', ttsPlaceholder: 'Enter text to synthesize…',
        instructPh: 'Free-form description, e.g. "female, calm"',
        ttsHint: 'A free-form attribute description overrides the preset selection.',
        cloneTitle: 'Voice Cloning',
        refAudioLbl: 'Reference audio (3–10 s, WAV/MP3)',
        refTextLbl: 'Reference transcript (exact text)',
        refTextPh: 'What is spoken in the reference audio …',
        cloneBtn: 'Clone & speak',
        cloneHint: 'POST /v1/audio/clone — only clone voices you have the rights and consent to.',
        svcTitle: 'Service', svcEngine: 'Engine', svcApi: 'API', svcLang: 'Languages', svcFmt: 'Format',
        genBtn: 'Generate speech', genBtnBusy: 'Generating…', cloneBtnBusy: 'Cloning…',
        healthChecking: 'Checking status…', healthOk: 'Ready', healthBad: 'Unreachable',
        cfgModel: 'Model', errNoText: 'Please enter some text first.',
        errNoRef: 'Please select a reference audio file.', generating: 'Generating audio…',
        done: 'Done', size: 'Size', emptyAudio: '(empty audio)', errFileRead: 'Could not read file.',
      }
    };
    let LANG = 'de';
    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n'); if (I18N[LANG][k]) el.textContent = I18N[LANG][k];
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const k = el.getAttribute('data-i18n-ph'); if (I18N[LANG][k]) el.placeholder = I18N[LANG][k];
      });
      document.getElementById('langDE').classList.toggle('active', LANG === 'de');
      document.getElementById('langEN').classList.toggle('active', LANG === 'en');
      document.documentElement.lang = LANG;
    }
    document.getElementById('langDE').addEventListener('click', () => { LANG = 'de'; applyLang(); });
    document.getElementById('langEN').addEventListener('click', () => { LANG = 'en'; applyLang(); });
    applyLang();

    const statusEl = document.getElementById('status');
    const audioWrap = document.getElementById('audioWrap');
    const player = document.getElementById('player');
    const audioSize = document.getElementById('audioSize');

    function setStatus(cls, msg) { statusEl.className = 'status' + (cls ? ' ' + cls : ''); statusEl.textContent = msg; }
    function setLoading(msg) { statusEl.className = 'status'; statusEl.innerHTML = '<span class="spinner"></span>' + msg; }
    function showAudio(blob) {
      player.src = URL.createObjectURL(blob);
      audioSize.textContent = I18N[LANG].size + ': ' + (blob.size / 1024).toFixed(0) + ' KB';
      audioWrap.classList.add('show');
      player.play().catch(() => {});
    }

    async function checkHealth() {
      try {
        await fetch('/health').then(r => r.json());
        document.getElementById('healthInfo').innerHTML =
          '<span class="ok">●</span> <span>' + I18N[LANG].healthOk + '</span>';
      } catch (e) {
        document.getElementById('healthInfo').innerHTML =
          '<span class="bad">●</span> <span>' + I18N[LANG].healthBad + '</span>';
      }
    }

    async function generateSpeech() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) { setStatus('error', I18N[LANG].errNoText); return; }
      const instruct = document.getElementById('instructInput').value.trim();
      const voice = instruct || document.getElementById('voiceSelect').value;
      const btn = document.getElementById('generateBtn');
      btn.disabled = true; btn.textContent = I18N[LANG].genBtnBusy;
      audioWrap.classList.remove('show'); setLoading(I18N[LANG].generating);
      try {
        const res = await fetch('/v1/audio/speech', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'omnivoice', input: text, voice: voice })
        });
        if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || e.message || ('HTTP ' + res.status)); }
        const blob = await res.blob();
        if (blob.size === 0) { setStatus('error', I18N[LANG].emptyAudio); return; }
        showAudio(blob); setStatus('success', I18N[LANG].done);
      } catch (e) { setStatus('error', 'Error: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = I18N[LANG].genBtn; }
    }

    async function cloneVoice() {
      const text = document.getElementById('textInput').value.trim();
      const fileInput = document.getElementById('refAudio');
      const refText = document.getElementById('refText').value.trim();
      if (!text) { setStatus('error', I18N[LANG].errNoText); return; }
      if (!fileInput.files.length) { setStatus('error', I18N[LANG].errNoRef); return; }
      const btn = document.getElementById('cloneBtn');
      btn.disabled = true; btn.textContent = I18N[LANG].cloneBtnBusy;
      audioWrap.classList.remove('show'); setLoading(I18N[LANG].generating);
      try {
        const refBuf = await fileInput.files[0].arrayBuffer();
        const fd = new FormData();
        fd.append('text', text);
        fd.append('ref_audio', new Blob([refBuf], { type: 'application/octet-stream' }), 'ref.wav');
        if (refText) fd.append('ref_text', refText);
        const res = await fetch('/v1/audio/clone', { method: 'POST', body: fd });
        if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || e.message || ('HTTP ' + res.status)); }
        const blob = await res.blob();
        if (blob.size === 0) { setStatus('error', I18N[LANG].emptyAudio); return; }
        showAudio(blob); setStatus('success', I18N[LANG].done);
      } catch (e) { setStatus('error', 'Error: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = I18N[LANG].cloneBtn; }
    }

    document.getElementById('generateBtn').addEventListener('click', generateSpeech);
    document.getElementById('cloneBtn').addEventListener('click', cloneVoice);
    checkHealth();
    setInterval(checkHealth, 30000);
    </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimomnivoice-env
  namespace: {{ .Release.Namespace }}
data:
  MODEL_ID: {{ .Values.env.MODEL_ID | quote }}
  DEVICE: {{ .Values.env.DEVICE | quote }}
  HF_HOME: {{ .Values.env.HF_HOME | quote }}
  CUDA_DEVICE_MEMORY_LIMIT_0: {{ .Values.env.CUDA_DEVICE_MEMORY_LIMIT_0 | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimomnivoice-transcode
  namespace: {{ .Release.Namespace }}
data:
  tts-transcode.py: |
    #!/usr/bin/env python3
    # TTS -> MP3 transcode proxy.
    # OmniVoice returns WAV/FLAC/OGG, but LiteLLM hardcodes Content-Type:
    # audio/mpeg for OpenAI TTS backends. Re-encode to real MP3 so the
    # client/browser decodes correctly.
    import subprocess
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    BACKEND = "http://127.0.0.1:{{ .Values.apiPort }}"

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            if self.path != "/v1/audio/speech":
                self.send_error(404)
                return
            length = int(self.headers.get("Content-Length", 0) or 0)
            body = self.rfile.read(length)
            req = urllib.request.Request(
                BACKEND + "/v1/audio/speech",
                data=body,
                headers={"Content-Type": self.headers.get("Content-Type", "application/json")},
                method="POST",
            )
            try:
                with urllib.request.urlopen(req, timeout=300) as resp:
                    wav = resp.read()
            except Exception:
                self.send_error(502)
                return
            proc = subprocess.run(
                ["ffmpeg", "-loglevel", "error", "-i", "-",
                 "-c:a", "libmp3lame", "-b:a", "128k", "-f", "mp3", "-"],
                input=wav, capture_output=True,
            )
            if proc.returncode == 0 and proc.stdout:
                self.send_response(200)
                self.send_header("Content-Type", "audio/mpeg")
                self.send_header("Content-Length", str(len(proc.stdout)))
                self.end_headers()
                self.wfile.write(proc.stdout)
            else:
                # fallback: pass the original audio through
                self.send_response(200)
                self.send_header("Content-Type", "audio/wav")
                self.send_header("Content-Length", str(len(wav)))
                self.end_headers()
                self.wfile.write(wav)

        def log_message(self, fmt, *args):
            pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", {{ .Values.transcodePort }}), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimomnivoice
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimomnivoice
spec:
  replicas: {{ .Values.workloads.aimomnivoice.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: aimomnivoice
  strategy:
    type: {{ .Values.strategy.type }}
  template:
    metadata:
      labels:
        app: aimomnivoice
    spec:
      containers:
      # Container 1: OmniVoice FastAPI runtime
      - name: omnivoice-api
        image: "{{ .Values.image.full }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          - name: HF_TOKEN
            value: {{ .Values.olaresEnv.HF_TOKEN | default "" | quote }}
        envFrom:
          - configMapRef:
              name: aimomnivoice-env
        ports:
          - containerPort: {{ .Values.apiPort }}
            name: api
        resources:
            {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          - name: models
            mountPath: /app/models
          - name: dshm
            mountPath: /dev/shm
          - name: main-patch
            mountPath: /app/main.py
            subPath: main.py
        startupProbe:
            {{- toYaml .Values.startupProbe | nindent 10 }}
        livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 10 }}

      # Container 2: nginx Dashboard
      - name: nginx
        image: "{{ .Values.nginx.image }}"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: {{ .Values.dashboardPort }}
            name: dashboard
        resources:
            {{- toYaml .Values.nginxResources | nindent 10 }}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: dashboard-html
            mountPath: /usr/share/nginx/html

      # Container 3: WAV -> MP3 transcode proxy for /v1/audio/speech
      # (LiteLLM declares audio/mpeg; OmniVoice serves WAV)
      - name: tts-transcode
        image: "{{ .Values.transcode.image }}"
        imagePullPolicy: IfNotPresent
        command:
          - "sh"
          - "-c"
          - "apk add --no-cache ffmpeg >/dev/null 2>&1; python /opt/tts-transcode.py"
        ports:
          - containerPort: {{ .Values.transcodePort }}
            name: transcode
        resources:
            {{- toYaml .Values.transcode.resources | nindent 10 }}
        volumeMounts:
          - name: transcode-script
            mountPath: /opt/tts-transcode.py
            subPath: tts-transcode.py

      volumes:
        - name: models
          hostPath:
            path: {{ .Values.userspace.appData }}/models/omnivoice
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.volumes.dshm.sizeLimit }}
        - name: nginx-config
          configMap:
            name: aimomnivoice-dashboard
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: dashboard-html
          configMap:
            name: aimomnivoice-dashboard
        - name: transcode-script
          configMap:
            name: aimomnivoice-transcode
            items:
              - key: tts-transcode.py
                path: tts-transcode.py
        - name: main-patch
          configMap:
            name: aimomnivoice-code
            items:
              - key: main.py
                path: main.py
---
apiVersion: v1
kind: Service
metadata:
  name: aimomnivoice
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimomnivoice
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: dashboard
      port: {{ .Values.dashboardPort }}
      targetPort: {{ .Values.dashboardPort }}
      protocol: TCP
    - name: api
      port: {{ .Values.apiPort }}
      targetPort: {{ .Values.apiPort }}
      protocol: TCP
  selector:
    app: aimomnivoice
