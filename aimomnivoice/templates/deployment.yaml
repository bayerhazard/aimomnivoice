---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimomnivoice-env
  namespace: {{ .Release.Namespace }}
data:
  MODEL_ID: {{ .Values.env.MODEL_ID | quote }}
  DEVICE: {{ .Values.env.DEVICE | quote }}
  HF_HOME: {{ .Values.env.HF_HOME | quote }}
  CUDA_DEVICE_MEMORY_LIMIT_0: "5120m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimomnivoice-transcode
  namespace: {{ .Release.Namespace }}
data:
  tts-transcode.py: |
    #!/usr/bin/env python3
    # TTS-Formatproxy vor der OmniVoice-API.
    # Die Engine liefert WAV/FLAC/OGG; mp3 und opus kann sie nicht und
    # antwortet dann mit WAV-Bytes unter Content-Type audio/mpeg
    # (siehe audio_to_bytes() in main.py). Clients, die sich auf
    # response_format verlassen -- Rocket z.B. schneidet MP3-Rahmen --
    # bekommen damit unbrauchbaren Ton. Dieser Proxy re-encodiert nur die
    # Formate, die die Engine nicht selbst kann; wav/flac/ogg gehen
    # unveraendert durch.
    import json
    import re
    import subprocess
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlsplit

    BACKEND = "http://127.0.0.1:{{ .Values.apiPort }}"

    MIME = {
        "wav": "audio/wav",
        "mp3": "audio/mpeg",
        "flac": "audio/flac",
        "ogg": "audio/ogg",
        "opus": "audio/ogg",
    }
    FFMPEG_ARGS = {
        "mp3": ["-c:a", "libmp3lame", "-b:a", "128k", "-f", "mp3"],
        "opus": ["-c:a", "libopus", "-b:a", "96k", "-f", "ogg"],
    }


    def format_aus_body(body):
        """response_format lesen: JSON zuerst, sonst multipart/urlencoded."""
        rohtext = body.decode("utf-8", "replace")
        try:
            wert = json.loads(rohtext).get("response_format")
            if wert:
                return str(wert).lower()
        except Exception:
            pass
        m = re.search(r'response_format["\']?\s*(?::|=|\r?\n\r?\n)\s*["\']?([a-zA-Z]+)', rohtext)
        return m.group(1).strip().lower() if m else "wav"


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            # Nur der Pfad entscheidet; ein Query-String (?model=...) ist
            # erlaubt und wird weitergereicht (z.B. `router call speak`).
            teile = urlsplit(self.path)
            if teile.path != "/v1/audio/speech":
                self.send_error(404)
                return
            length = int(self.headers.get("Content-Length", 0) or 0)
            body = self.rfile.read(length)
            fmt = format_aus_body(body)

            ziel = BACKEND + "/v1/audio/speech" + (("?" + teile.query) if teile.query else "")
            req = urllib.request.Request(
                ziel,
                data=body,
                headers={"Content-Type": self.headers.get("Content-Type", "application/json")},
                method="POST",
            )
            try:
                with urllib.request.urlopen(req, timeout=300) as resp:
                    audio = resp.read()
                    upstream_type = (resp.headers.get("Content-Type") or "").split(";")[0].strip()
            except Exception:
                self.send_error(502)
                return

            args = FFMPEG_ARGS.get(fmt)
            if args:
                proc = subprocess.run(
                    ["ffmpeg", "-loglevel", "error", "-i", "-"] + args + ["-"],
                    input=audio, capture_output=True,
                )
                if proc.returncode == 0 and proc.stdout:
                    self._audio(MIME.get(fmt, "application/octet-stream"), proc.stdout)
                    return
                # ffmpeg nicht moeglich: Original kommt als WAV -- ehrlich ausliefern.
                self._audio("audio/wav", audio)
                return
            self._audio(upstream_type or MIME.get(fmt, "audio/wav"), audio)

        def _audio(self, ctype, data):
            self.send_response(200)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, fmt, *args):
            pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", {{ .Values.transcodePort }}), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimomnivoice
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimomnivoice
spec:
  replicas: {{ .Values.workloads.aimomnivoice.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: aimomnivoice
  strategy:
    type: {{ .Values.strategy.type }}
  template:
    metadata:
      labels:
        app: aimomnivoice
    spec:
      # Model Console (llm-init) runs as UID 1000 and must own its shared cache
      # + run-state dirs; the hostPath mounts arrive root-owned.
      initContainers:
      - name: init-chown
        image: docker.io/beclab/aboveos-busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - "mkdir -p /cache/hf/hub/.locks /run/llm-init && chown -R 1000:1000 /cache/hf/hub /run/llm-init || true"
        volumeMounts:
        - name: llm-init-cache
          mountPath: /cache/hf/hub
        - name: llm-init-run
          mountPath: /run/llm-init
        securityContext:
          runAsUser: 0
        resources: {}
      containers:
      # Container 1: OmniVoice FastAPI runtime
      - name: omnivoice-api
        image: "{{ .Values.image.full }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          - name: HF_TOKEN
            value: {{ .Values.olaresEnv.HF_TOKEN | default "" | quote }}
        envFrom:
          - configMapRef:
              name: aimomnivoice-env
        ports:
          - containerPort: {{ .Values.apiPort }}
            name: api
        resources:
          limits:
            cpu: "8"
            memory: 16Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "5120"
          requests:
            cpu: "2"
            memory: 6Gi
            nvidia.com/gpu: "1"
            nvidia.com/gpumem: "5120"
        volumeMounts:
          - name: models
            mountPath: /app/models
          - name: dshm
            mountPath: /dev/shm
          - name: main-patch
            mountPath: /app/main.py
            subPath: main.py
        startupProbe:
            {{- toYaml .Values.startupProbe | nindent 10 }}
        livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 10 }}

      # Container 2: nginx Dashboard
      - name: nginx
        image: "{{ .Values.nginx.image }}"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: {{ .Values.dashboardPort }}
            name: dashboard
        resources:
            {{- toYaml .Values.nginxResources | nindent 10 }}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: dashboard-html
            mountPath: /usr/share/nginx/html

      # Container 3: WAV -> MP3 transcode proxy for /v1/audio/speech
      # (LiteLLM declares audio/mpeg; OmniVoice serves WAV)
      - name: tts-transcode
        image: "{{ .Values.transcode.image }}"
        imagePullPolicy: IfNotPresent
        command:
          - "sh"
          - "-c"
          - "apk add --no-cache ffmpeg >/dev/null 2>&1; python /opt/tts-transcode.py"
        ports:
          - containerPort: {{ .Values.transcodePort }}
            name: transcode
        resources:
            {{- toYaml .Values.transcode.resources | nindent 10 }}
        volumeMounts:
          - name: transcode-script
            mountPath: /opt/tts-transcode.py
            subPath: tts-transcode.py

      # Container 4: Model Console (llm-init) — Router-visible TTS data plane.
      # ENGINE_KIND=audio + MODEL_MODE=tts proxies to the sibling omnivoice-api
      # via LLM_INIT_TEST_ENGINE_URL (no service rename). It downloads the model
      # into the shared appCommon HF cache (redundant with the baked weights,
      # but that is what Model Console requires).
      - name: llm-init
        image: "docker.io/beclab/llm-init:v1.7.12"
        imagePullPolicy: IfNotPresent
        env:
          - name: ENGINE_KIND
            value: "audio"
          # Zeigt auf nginx (dashboardPort), nicht direkt auf die API (apiPort):
          # nginx leitet /v1/audio/speech an den Format-Proxy (transcodePort) und
          # alles andere an die API. Ueber die reine API kaeme mp3/opus als WAV
          # mit falschem Content-Type zurueck (siehe tts-transcode.py).
          - name: LLM_INIT_TEST_ENGINE_URL
            value: "http://127.0.0.1:{{ .Values.dashboardPort }}"
          - name: MODEL_NAME
            value: "omnivoice"
          - name: MODEL_MODE
            value: "tts"
          - name: MODEL_SUPPORTS
            value: "supports_tts,supports_tts_clone,supports_tts_design,supports_tts_custom"
          - name: MODEL_SOURCE
            value: "hf://k2-fsa/OmniVoice"
          - name: HF_HOME
            value: /cache/hf
          - name: HF_HUB_CACHE
            value: /cache/hf/hub
          - name: HUGGINGFACE_HUB_CACHE
            value: /cache/hf/hub
          {{- if .Values.olaresEnv.HF_ENDPOINT }}
          - name: HF_ENDPOINT
            value: "{{ .Values.olaresEnv.HF_ENDPOINT }}"
          {{- end }}
          {{- if .Values.olaresEnv.HF_TOKEN }}
          - name: HF_TOKEN
            value: "{{ .Values.olaresEnv.HF_TOKEN }}"
          {{- end }}
          - name: RUN_DIR
            value: /run/llm-init
          - name: PORT
            value: "8090"
          - name: LOG_LEVEL
            value: "info"
        ports:
          - containerPort: 8090
            name: model-console
        readinessProbe:
          httpGet:
            path: /livez
            port: 8090
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: 8090
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 4Gi
        volumeMounts:
          - name: llm-init-cache
            mountPath: /cache/hf/hub
          - name: llm-init-run
            mountPath: /run/llm-init

      volumes:
        - name: models
          hostPath:
            path: {{ .Values.userspace.appData }}/models/omnivoice
            type: DirectoryOrCreate
        - name: llm-init-cache
          hostPath:
            path: {{ .Values.userspace.appCommon }}/huggingface
            type: DirectoryOrCreate
        - name: llm-init-run
          hostPath:
            path: {{ .Values.userspace.appCache }}/llm-init-run/aimomnivoice
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.volumes.dshm.sizeLimit }}
        - name: nginx-config
          configMap:
            name: aimomnivoice-dashboard
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: dashboard-html
          configMap:
            name: aimomnivoice-dashboard
        - name: transcode-script
          configMap:
            name: aimomnivoice-transcode
            items:
              - key: tts-transcode.py
                path: tts-transcode.py
        - name: main-patch
          configMap:
            name: aimomnivoice-code
            items:
              - key: main.py
                path: main.py
---
apiVersion: v1
kind: Service
metadata:
  name: aimomnivoice
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimomnivoice
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: dashboard
      port: {{ .Values.dashboardPort }}
      targetPort: {{ .Values.dashboardPort }}
      protocol: TCP
    - name: api
      port: {{ .Values.apiPort }}
      targetPort: {{ .Values.apiPort }}
      protocol: TCP
  selector:
    app: aimomnivoice
---
# Model Console control/data plane (llm-init): dashboard on "/", engine /v1/*
# reverse-proxied; authLevel internal.
apiVersion: v1
kind: Service
metadata:
  name: download-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimomnivoice
spec:
  selector:
    app: aimomnivoice
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
# The Service behind the sharedEntrances stub: :80 -> llm-init:8090,
# in-cluster only (no edge, no SSO).
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimomnivoice
spec:
  selector:
    app: aimomnivoice
  ports:
    - name: http
      port: 80
      targetPort: 8090
      protocol: TCP
